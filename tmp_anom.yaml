model:
  kernel_size: 7
  base_filters: 32
  num_layers: 2
  compression_factor: 3
  bottleneck_conv: 0
  decoder_mode: base_filters
  activation: Relu
  bottleneck_activation: null
  aux_channels: 1
  increasing: 1
  flattened: 1
  pool: 1
  halve_both: 1
  halve_time: 0
  halve_features: 0
  double_deconv: 1
  stride: 1
  dilation: 1
dataset:
  csv_path: /davinci-1/home/lorenrossi/data_fiorire/AllScenarios_CMG.csv
  n_seq_chunk: 200
  test_chunk_ratio: 0.2
  val_ratio: 0.2
  n_features: null
  seq_in_length: 16
  seq_stride_train: 4
  seq_stride_val: 16
  seq_stride_test: 16
  num_workers: 16
  val_anomaly_ratio: 1.0
  test_anomaly_ratio: 1.0
  shuffle_test: true
  delta_min: 0.5
  delta_max: 0.5
opt:
  lr: 0.001
  batch_size: 300
  lr_patience: 10
  es_patience: 30
  lr_factor: 0.5
  lr_min: 1.0e-06
  monitor_metric: val_roc_auc
  monitor_mode: max
defense:
  checkpoint_path: /davinci-1/home/lorenrossi/log_fiorire/lightning_logs/cmg_prova/reg_train_1/checkpoints/best-epoch=376-val_roc_auc=0.9004.ckpt
  alpha: 0.01
  epsilon: 0.01
  pgd_steps: 1
  num_iter: 1
  regularization: false
  warmup_epochs: 10
  lambda_init: 0.01
  lambda_min: 1.0e-06
  lambda_max: 0.1
  lipschitz_target: 5.0
  lr_lambda: 0.01
  ema_decay: 0.95
trainer:
  accelerator: gpu
  devices: 4
  strategy: ddp
  epochs: 1000
  precision: bf16-mixed
  accumulate_grad_batches: 4
  out_dir: /davinci-1/home/lorenrossi/log_fiorire/lightning_logs
  name_exp: cmg_prova
  run_name: test_regularized
metrics:
  types:
  - mse/mae
  - pr_auc
  - roc_auc
  perturb_test: true
  perturb_fraction: 0.5
  real_noise_params:
    gaussian_std: 0.01
    dropout_prob: 0.1
    impulse_std: 0.1
  test_mode: anom
curves:
