  adversarial_epsilons:
  - 0.001
  - 0.005
  - 0.01
  - 0.05
  - 0.1
  gaussian_stds:
  - 0.005
  - 0.01
  - 0.015
  - 0.02
  - 0.025
  dropout_probs:
  - 0.05
  - 0.1
  - 0.15
  - 0.2
  - 0.25
  impulse_stds:
  - 0.05
  - 0.1
  - 0.15
  - 0.2
  - 0.25
