model:
  kernel_size: 7
  base_filters: 32
  num_layers: 2
  compression_factor: 4
  bottleneck_conv: 0
  decoder_mode: "base_filters"
  activation: "Relu"
  bottleneck_activation: null
  aux_channels: 1
  increasing: 1
  flattened: 1
  pool: 1
  halve_both: 1        # dimezza feature + time
  halve_time: 0
  halve_features: 0
  double_deconv: 1
  # - usati se pool = false ----
  stride: 1
  dilation: 1

dataset:
  csv_path: "/davinci-1/home/lorenrossi/data_fiorire/AllScenarios_CMG.csv"
  n_seq_chunk: 200                    # how many sequences for each chunk
  test_chunk_ratio: 0.2               # % test set
  val_ratio: 0.2                      # % validation set
  n_features: null                    # dimensione features F - sovrascritto
  seq_in_length: 16                   # dimensione temporale T
  seq_stride_train: 4                 # stride per train
  seq_stride_val: 16                  # stride per validation
  seq_stride_test: 16                 # stride per test
  num_workers: 16                     # workers for the dataloader
  label_granularity: "sequence"       # una label sequenza ("sequence") o una per timestamp ("timestamp")
  val_anomaly_ratio: 1.0              # % di finestre da corrompere da aggiungere nel validation set
  test_anomaly_ratio: 1.0             # % di finestre da corrompere da aggiungere nel test set
  shuffle_train: false                # se usare random sampler sul train
  shuffle_val: true                   # se usare random sampler sul validation
  shuffle_test: true                  # se usare random sampler sul test
  delta_min: 0.5                      # delta range of anomalies - extract from uniform distribution
  delta_max: 0.5

opt:
  lr: 1e-3
  batch_size: 300
  lr_patience: 10                     # patience for the scheduler
  es_patience: 100                     # patience for early stopping
  lr_factor: 0.8                      # factor for the scheduler
  lr_min: 1e-6                        # min learning to stop when reached
  monitor_metric: "val_roc_auc"       # metrica da monitorare
  monitor_mode: "max"                 # "min" o "max"

attack:
  type: "l1"        # attack type: l1 | l0
  attack_data_ratio: 0.5 # percentage of adversarial (1-ratio randomized)
  # shared params
  num_iter: 10      # number of attack iterations
  # l0-specific
  k: 5              # number of features to perturb (top-k by gradient magnitude)
  # l1-specific
  budget: 30        # max l1 perturbation budget (as % of input l1 norm)
  # real noise applied to clean samples
  random_num_vectors: 200
  random_noise_std: 1.0  

defense:
  # path to load the checkpoint from
  checkpoint_path: "/davinci-1/home/lorenrossi/log_fiorire/lightning_logs/cmg_prova/reg_train_1/checkpoints/best-epoch=376-val_roc_auc=0.9004.ckpt"
  apply_defense: false                # if applying defense in test or not
  alpha: 1e-1                         # intensity for each step size of pgd
  num_iter: 1                         # number of projection steps
  # adversarial training
  regularization: true                # flag to use jacobian regularization
  controller: "ratio"                 # decide which EMA is used: "ratio" | "norm"
  target_norm: 1.0                    # parametro specifico per "norm"
  target_ratio: 0.2                   # parametro specifico per "ratio"
  save_lipschitz: 5                   # number of epochs after we save the norm on validation set (before overfitting ideally)
  lambda_init: 1e-1                   # max lambda allowed (lambda for latent loss)
  lambda_min: 1e-4                    # lambda minimo consentito
  lambda_max: 1                       # max lambda consentito
  lr_lambda: 0.01                     # velocità adattamento lambda
  ema_decay: 0.95                     # smoothing EMA norma

trainer:
  accelerator: "gpu"
  devices: 4
  strategy: "ddp"
  epochs: 1000
  precision: "bf16-mixed"
  accumulate_grad_batches: 4
  out_dir: "/davinci-1/home/lorenrossi/log_fiorire/lightning_logs"
  name_exp: CMG
  run_name: reg_aug_train

metrics:
  types: ["mse/mae", "pr_auc", "roc_auc"]  # metrics to be computed in validation and test
  return_curves: true                      # to plot pr/roc curves
  perturb_test: true                       # flag to decide to perturb (bot adv e real) the test set or not
  p95: 0.004                               # 95-th percentile of clean scores used as threshold
  perturbation_budget:
    n_samples: 250
    budget_high: 200.0
    n_iter_search: 10
    n_iter_attack: 10
    tol: 0.5
    boundary_tol: 1.0
    n_plot: 5

curves:
  enabled: true
  attacks:
    l1_budget:    [5,10,20,30,40]
    l0_k:         [1,2,5,10,15]
    random_noise_std:   [0.01, 0.05, 0.1, 0.5, 1.0]