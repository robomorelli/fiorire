# Optimization
tune_config:
  model.num_layers: tune.choice([2, 3])
  model.base_filters: tune.choice([8, 16])
  model.activation: tune.choice(['Relu', 'Elu'])
  model.bottleneck_activation: tune.choice(['Tanh'])
  model.kernel_size: tune.choice([5])
  model.double_deconv: tune.choice([1])
  model.compression_factor: tune.choice([1])
  model.halve_both: tune.choice([1])
  model.halve_time: tune.choice([0])
  model.halve_features: tune.choice([0])
  model.flattened: tune.choice([1])
  model.increasing: tune.choice([1])
  model.pool: tune.choice([1])
  model.stride: tune.choice([1])
  model.dilation: tune.choice([1])

  opt.lr: tune.choice([0.0009, 0.0001])
  opt.batch_size: tune.choice([500])
  opt.epochs: tune.choice([200])
  opt.lr_patience: tune.choice([5, 10])
  opt.es_patience: tune.choice([25, 35])

  dataset.scaler: tune.choice(['StandardScaler'])
  dataset.seq_in_length: tune.choice([8, 16, 32])
  dataset.perc_overlap: tune.choice([0.2, 0.5])

# Dataset
dataset:
  seed: 42
  name: 'fiorire_1'
  upsample_factor: 1
  upsample_method: 'linear'
  upsample_augmentation: 0
  flag_col: null    #"ACT40082(PREPRO_CMG_ENABLE)"
  align_data: 0
  detect_flag: 0
  data_path: './data/fiorire_1/all_2016-2018_clean_4s.pkl' #'./data/fiorire_1/all_2016-2018_clean_4s.pkl'    #'./data/fiorire_2/nominal_merged.csv'
  seq_in_length_into_chunk: 2000    # number of sequences for each split chunk
  seq_out_length: null
  train_val_split: 0.8
  shuffle_train: True #shuffle the idx of the train
  feats: ['RW1_motcurr', 'RW2_motcurr', 'RW3_motcurr', 'RW4_motcurr',
          'RW1_therm', 'RW2_therm', 'RW3_therm', 'RW4_therm',
          'RW1_speed', 'RW2_speed', 'RW3_speed', 'RW4_speed',
          'RW1_cmd_volt', 'RW2_cmd_volt', 'RW3_cmd_volt', 'RW4_cmd_volt']
  target: null    # null: the same input features are the target (reconstruction task); all: all the variables of the dataframe are the target; list/str: specific value/s
  remove_target: False
  dataset_subset: 5000_000
  save_dataloaders: False
  forecast: False
  is_anomaly_column: 'is_anomaly'   # name of the anomaly column; if None there are no anomalous sequences

# Model
model:
  name: 'conv_ae2D'
  aux_channels: 1   # 1 if the input is (batch, channels, height, width); height=features, width=seq_in_length; channels=1 mono-channels

resources:
  gpu_trial: 1
  cpu_trial: 12

opt:
  seed: 42
  opt_metric: {'val_loss':'min'}   #val_loss; val_f1_score; val_roc_auc This is the metric key used to rank the models (the optimization is still on the loss)
  metrics_to_report: ['train_loss', 'val_f1_score', 'best_val_f1_score',
                      'val_roc_auc', 'best_val_roc_auc', "val_fpr", "best_val_fpr", "val_tpr", "best_val_tpr",
                      "best_val_thresh_f1"]  # list of metrics to report in the summary of the results
  other_reports: ['parameters_number']
  order_by: 'val_loss'    # summary of the results is ordered by this value
  num_workers: 12
  evaluate_metrics: True
  anomalies_dataset_subset: null
  n_std: [1, 3]
  metrics_dataset_path: './data/fiorire_1/all_2016-2018_clean_4s_05_128_with_anomalies.pkl'   # if None, the test dataset is taken from the validation adding the anomalous sequences if availablr
  detect_anomaly_epoch_freq: 1
  normal_anomalous_ratio: 1
  exp_name: 'conv_ae2D_fiorire'
  max_epochs: 500

