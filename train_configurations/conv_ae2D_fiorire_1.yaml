
  # Optimization
  tune_config:
    opt.fine_tuning: tune.choice([1])
    opt.checkpoint_path: tune.choice(["./ray_results/hpo_full_2D_3anomalies_delta3/conv_ae2D_fiorire_2025-11-29_20-05-06/conv_ae2D_fiorire/517fa_00000_overlap=0.7000_scaler=StandardSc_seqlen=16_act=Elu_filters=32/checkpoint_000023/model.pt"])
    opt.fine_tuning_mode: tune.choice(['adaptive_layer', 'latent_space'])    #   'latent_space'

    opt.freeze_layers: tune.choice(['encoder', 'encoder-bottelneck', 'encoder-decoder', '0', 'bottelneck', '10'])  # 'all', 'encoder', 'decoder', 'none', 'bottelneck' , 'numeric value
    opt.lr: tune.choice([0.0009, 0.0001, 0.00005]]])
    opt.bottleneck_lr: tune.choice([0.0001, 0.00005, 0]]])
    opt.batch_size: tune.choice([500])
    opt.epochs: tune.choice([200])
    opt.lr_patience: tune.choice([5, 10])
    opt.es_patience: tune.choice([15])

    dataset.scaler: tune.choice(['StandardScaler'])
    dataset.seq_in_length: tune.choice([16])
    dataset.perc_overlap: tune.choice([0.7])

  # Dataset
  dataset:
    seed: 42
    name: 'fiorire_1'
    upsample_factor: 1
    upsample_method: 'linear'
    upsample_augmentation: 0
    flag_col: "ACT40082(PREPRO_CMG_ENABLE)"
    align_data: 1
    detect_flag: 1
    data_path: './data/fiorire_2/nominal_merged.csv'
    seq_in_length_into_chunk: 2000    # number of sequences for each split chunk
    seq_out_length: null
    train_val_split: 0.8
    shuffle_train: True #shuffle the idx of the train
    feats: [
      "ACT40001(PREPRO_CMG_LEVEL)", "ACT40101(MODEMNG_CMG_TORQUE_REQ_X)", "ACT40102(MODEMNG_CMG_TORQUE_REQ_Y)",
      "ACT40103(MODEMNG_CMG_TORQUE_REQ_Z)", "ACT41027(UNIT_FW_VEL_1)", "ACT41028(UNIT_FW_VEL_2)",
      "ACT41029(UNIT_FW_VEL_3)", "ACT41037(UNIT_GIMB_POS_1)", "ACT41038(UNIT_GIMB_POS_2)",
      "ACT41039(UNIT_GIMB_POS_3)", "ACT41042(UNIT_GIMB_VEL_1)", "ACT41043(UNIT_GIMB_VEL_2)",
      "ACT41044(UNIT_GIMB_VEL_3)", "ACT41052(ASSEMBLY_H_BRF_X)", "ACT41053(ASSEMBLY_H_BRF_Y)",
      "ACT41054(ASSEMBLY_H_BRF_Z)", "ACT41056(ASSEMBLY_T_BRF_X)", "ACT41057(ASSEMBLY_T_BRF_Y)",
      "ACT41058(ASSEMBLY_T_BRF_Z)" ]

    target: null    # null: the same input features are the target; all: all the variables of the dataframe are the target; list/str: specific value/s
    remove_target: False
    dataset_subset: null
    save_dataloaders: False
    forecast: False
    is_anomaly_column: 'is_anomaly'   # name of the anomaly column; if None there are no anomalous sequences

  # Model
  model:
    name: 'conv_ae2D'
    aux_channels: 1   # 1 if the input is (batch, channels, height, width); height=features, width=seq_in_length; channels=1 mono-channels
    checkpoint_path: null

  resources:
    gpu_trial: 1
    cpu_trial: 12

  opt:
    opt_metric: { 'val_loss': 'min' }   #val_loss; val_f1_score This is the metric key used to rank the models (the optimization is still on the loss)
    metrics_to_report: ['train_loss', 'val_loss', 'val_f1_score', 'best_val_f1_score',
                      'val_roc_auc', 'best_val_roc_auc', "val_fpr", "best_val_fpr", "val_tpr", "best_val_tpr",
                      "best_val_thresh_f1"]  # list of metrics to report in the summary of the results
    other_reports: [ 'parameters_number' ]
    order_by: 'val_loss'    # summary of the results is ordered by this value
    num_workers: 12
    evaluate_metrics: True
    anomalies_dataset_subset: null  # subset used to compute the metrics during training
    keep_anoms_only_from_val: True
    n_std: [ 1, 3 ]
    num_thresholds: 100
    metrics_dataset_path: './data/fiorire_2/nominal_merged_delta_3_window_mean_16_perc_99_GWN_Step_Impulse_num_target_channels_19_with_anomalies.csv'  # if None, the test dataset is taken from the validation adding the anomalous sequences if availablr
    take_only_anomalies_from_metric_loader: True
    detect_anomaly_epoch_freq: 1
    normal_anomalous_ratio: 1
    exp_name: 'conv_ae2D_fiorire_fine_tuning'
    max_epochs: 500



