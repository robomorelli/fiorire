# Optimization
tune_config:
  opt.fine_tuning: tune.choice([1])
  opt.checkpoint_path: tune.choice(["./ray_results/fiorire1_hpc_multinode_conv2D_conv_ae2D_fiorire_2025-12-02_11-21-32/conv_ae2D_fiorire/aca04_00000_overlap=0.3000_scaler=StandardSc_seqlen=16_act=Elu_filters=64/checkpoint_000001/model.pt"])
  opt.fine_tuning_mode: tune.choice(['adaptive_layer', 'latent_space', 'hard_latent_space'])    #   'latent_space'

  opt.freeze_layers: tune.choice(['0', 'encoder'])  # 'all', 'encoder', 'decoder', 'none', 'bottelneck' , 'numeric value
  opt.lr: tune.choice([0.0009, 0.0003, 0.00005]]])
  opt.bottleneck_lr: tune.choice([0.0001, 0.00005, 0.00001, 0]]])
  opt.batch_size: tune.choice([100, 200, 800])
  opt.epochs: tune.choice([200])
  opt.lr_patience: tune.choice([7, 10, 15])
  opt.es_patience: tune.choice([15])

  dataset.scaler: tune.choice(['StandardScaler'])
  dataset.seq_in_length: tune.choice([16])
  dataset.perc_overlap: tune.choice([0.5, 0.7, 0.9])

# Dataset
dataset:
  seed: 42
  name: 'fiorire_2'
  upsample_factor: 1
  upsample_method: 'linear'
  upsample_augmentation: 0
  flag_col: null    #"ACT40082(PREPRO_CMG_ENABLE)"
  align_data: 0
  detect_flag: 0
  data_path: './data/fiorire_2/AllScenarios_CMG.csv'
  seq_in_length_into_chunk: 200    # number of sequences for each split chunk
  seq_out_length: null
  train_val_split: 0.8
  shuffle_train: True #shuffle the idx of the train
  feats: null
  target: null    # null: the same input features are the target; all: all the variables of the dataframe are the target; list/str: specific value/s
  remove_target: False
  dataset_subset: null
  save_dataloaders: False
  forecast: False
  is_anomaly_column: 'is_anomaly'   # name of the anomaly column; if None there are no anomalous sequences

# Model
model:
  name: 'conv_ae2D'
  aux_channels: 1   # 1 if the input is (batch, channels, height, width); height=features, width=seq_in_length; channels=1 mono-channels
  checkpoint_path: null

resources:
  gpu_trial: 1
  cpu_trial: 12

opt:
  opt_metric: {'val_loss':'min'}   #val_loss; val_f1_score This is the metric key used to rank the models (the optimization is still on the loss)
  metrics_to_report: ['train_loss', 'val_f1_score', 'best_val_f1_score',
                      'val_roc_auc', 'best_val_roc_auc', "val_fpr", "best_val_fpr",
                      "val_tpr", "best_val_tpr",
                      "best_val_thresh_f1"]  # list of metrics to report in the summary of the results
  other_reports: ['parameters_number']
  use_error: 'se'   # 'abs' or 'se'
  num_workers: 12
  evaluate_metrics: True
  anomalies_dataset_subset: null  # subset used to compute the metrics during training
  keep_anoms_only_from_val: True
  n_std: [1, 3]
  num_thresholds: 500
  metrics_dataset_path: './data/fiorire_2/AllScenarios_CMG_delta_8_window_mean_16_perc_99_GWN_Step_Impulse_num_target_channels_19_with_anomalies.csv'  # if None, the test dataset is taken from the validation adding the anomalous sequences if availablr
  take_only_anomalies_from_metric_loader: True
  detect_anomaly_epoch_freq: 1
  normal_anomalous_ratio: 1
  exp_name: 'conv_ae2D_fiorire_fine_tuning'
  max_epochs: 500

