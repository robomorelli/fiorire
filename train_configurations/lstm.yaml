# Optimization
tune_config:
      #intermediate_dim: tune.choice([1, 2, 5, 10, 20]))
      model.embedding_dim: tune.choice([10, 16, 20, 32, 40, 48])
      model.n_layers: tune.choice([1,2,3])
      model.n_cells: tune.choice([1,2])

      opt.lr: tune.choice([0.0006, 0.0003, 0.001])
      opt.batch_size: tune.choice([100, 500])
      opt.epochs: tune.choice([200])
      opt.lr_patience: tune.choice([5, 10])
      opt.es_patience: tune.choice([25, 35])

      dataset.scaler: tune.choice(['RobustScaler-0.05-0.95', 'StandardScaler'])  # other choices {StandardScaler: None}, None
      dataset.perc_overlap: tune.choice([0, 0.3, 0.7])
      dataset.seq_in_length: tune.choice([16])


# Dataset
dataset:
  seed: 42
  name: 'fiorire_1'
  upsample_factor: 1
  upsample_method: 'linear'
  upsample_augmentation: 0
  flag_col: null    #"ACT40082(PREPRO_CMG_ENABLE)"
  align_data: 0
  detect_flag: 0
  data_path: './data/fiorire_1/all_2016-2018_clean_4s.pkl' #'./data/fiorire_1/all_2016-2018_clean_4s.pkl'    #'./data/fiorire_2/nominal_merged.csv'
  seq_in_length_into_chunk: 2000    # number of sequences for each split chunk
  seq_out_length: null
  train_val_split: 0.8
  shuffle_train: True #shuffle the idx of the train
  feats: ['RW1_motcurr', 'RW2_motcurr', 'RW3_motcurr', 'RW4_motcurr',
          'RW1_therm', 'RW2_therm', 'RW3_therm', 'RW4_therm',
          'RW1_speed', 'RW2_speed', 'RW3_speed', 'RW4_speed',
          'RW1_cmd_volt', 'RW2_cmd_volt', 'RW3_cmd_volt', 'RW4_cmd_volt']
  target: null    # null: the same input features are the target (reconstruction task); all: all the variables of the dataframe are the target; list/str: specific value/s
  remove_target: False
  dataset_subset: null
  save_dataloaders: False
  forecast: False
  is_anomaly_column: 'is_anomaly'   # name of the anomaly column; if None there are no anomalous sequences

# Model
model:
  name: 'lstm'

resources:
  gpu_trial: 1
  cpu_trial: 12

opt:
  seed: 42
  opt_metric: {'val_loss':'min'}   #val_loss; val_f1_score; val_roc_auc This is the metric key used to rank the models (the optimization is still on the loss)
  metrics_to_report: ['train_loss', 'val_loss', 'val_f1_score', 'best_val_f1_score',
                      'val_roc_auc', 'best_val_roc_auc', "val_fpr", "best_val_fpr", "val_tpr", "best_val_tpr",
                      "best_val_thresh_f1"]  # list of metrics to report in the summary of the results
  other_reports: ['parameters_number']
  #order_by: 'val_loss'    # summary of the results is ordered by this value
  use_error: 'se'   # 'abs' or 'se'
  num_workers: 12
  evaluate_metrics: True
  anomalies_dataset_subset: 4000_000  # subset used to compute the metrics during training
  keep_anoms_only_from_val: True
  n_std: [1, 3]
  metrics_dataset_path: './data/fiorire_1/all_2016-2018_clean_4s_delta_01_window_mean_16_perc_95_GWN_Impulse_Step_num_target_channels_16_with_anomalies.pkl'  # if None, the test dataset is taken from the validation adding the anomalous sequences if availablr
  take_only_anomalies_from_metric_loader: True
  detect_anomaly_epoch_freq: 1
  normal_anomalous_ratio: 1
  exp_name: 'lstm_fiorire'
  max_epochs: 500
