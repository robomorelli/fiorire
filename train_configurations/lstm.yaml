# Optimization
tune_config:
      #intermediate_dim: tune.choice([1, 2, 5, 10, 20])
      opt.epochs: tune.choice([200])
      opt.lr: tune.choice([0.0006, 0.0003, 0.001])
      opt.batch_size: tune.choice([100, 500])
      opt.lr_patience: tune.choice([5, 10])

      model.embedding_dim: tune.choice([10, 16, 20, 32, 40, 48])
      model.n_layers: tune.choice([1,2,3])
      model.n_cells: tune.choice([1,2])

      dataset.scaler: tune.choice(['RobustScaler-0.05-0.95', 'StandardScaler'])  # other choices {StandardScaler: None}, None
      dataset.perc_overlap: tune.choice([0, 0.3, 0.7])
      dataset.seq_in_length: tune.choice([16])


# Dataset
dataset:
  name: 'fiorire'
  data_path: './data/fiorire/sentinel/dataset_4s/all_2016-2018_clean_4s.pkl'
  perc_overlap: 0.0
  chunks_num: 10
  seq_in_length: 16
  seq_out_length: null
  train_val_split: 0.8
  shuffle_train: True #shuffle the idx of the train
  feats: ['RW1_motcurr', 'RW2_motcurr', 'RW3_motcurr', 'RW4_motcurr']   #['RW1_motcurr', 'RW2_motcurr', 'RW3_motcurr', 'RW4_motcurr',
                  # 'RW1_therm', 'RW2_therm', 'RW3_therm', 'RW4_therm',
                  #'RW1_speed', 'RW2_speed', 'RW3_speed', 'RW4_speed',
                  #'RW1_cmd_volt', 'RW2_cmd_volt', 'RW3_cmd_volt', 'RW4_cmd_volt']
  target: null    # null: the same input features are the target; all: all the variables of the dataframe are the target; list/str: specific value/s
  remove_target: False
  dataset_subset: 12000
  scaler: 'RobustScaler-0.05-0.95'  # other coiches {StandarcScaler: None}, None
  save_dataloaders: False
  forecast: False
  is_anomaly_column: 'is_anomaly'

# Model
model:
  name: 'lstm'

resources:
  gpu_trial: 1
  cpu_trial: 12

opt:
  fine_tuning: False
  tune_report: 'val_loss'
  k_fold_cv: False
  metrics: ['train_loss', 'val_loss']
  order_by: 'val_loss'
  num_workers: 12
  evaluate_metrics: True
  n_std: [1, 3]
  metrics_dataset_path: './data/fiorire/sentinel/dataset_4s/all_2016-2018_clean_4s_test.pkl'   # if None, the test dataset is taken from the validation adding the anomalous sequences if availablr
  detect_anomaly_epoch_freq: 1
  exp_name: 'lstm_fiorire'
