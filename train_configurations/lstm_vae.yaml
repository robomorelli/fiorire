# Optimization
tune_config:
      epochs: tune.choice([500])
      lr: tune.choice([0.001, 0.0001, 0.0003, 0.0006, 0.0009])
      batch_size: tune.choice([10, 50, 100, 200, 500, 1000])
      seq_in_length: tune.choice([16])
      embedding_dim: tune.choice([2, 4, 8, 16, 32, 64])
      latent_dim: tune.choice([10, 20, 40, 60, 100])
      n_layers_1: tune.choice([1, 2])
      n_layers_2: tune.choice([1, 2])
      lr_patience: tune.choice([3, 5, 7, 10])
      recon_loss_type: tune.choice(["custom", "mse"])
      kld_factor: tune.choice([0.01, 0.1, 0.4, 0.6, 0.8, 1])

# Dataset
dataset:
  name: 'sentinel'
  sequential: False
  sample_rate: "4s"
  scaled: True
  clean: True
  shuffle: False #shuffle applied on the row of dataset
  feats: 'all'
  columns: ['RW1_motcurr', 'RW2_motcurr', 'RW3_motcurr', 'RW4_motcurr',
             'RW1_therm', 'RW2_therm', 'RW3_therm', 'RW4_therm',
            'RW1_speed', 'RW2_speed', 'RW3_speed', 'RW4_speed',
            'RW1_cmd_volt', 'RW2_cmd_volt', 'RW3_cmd_volt', 'RW4_cmd_volt']
  #columns: ['RW3_motcurr','RW3_therm',
  #          'RW3_speed', 'RW3_cmd_volt']
  dataset_subset: 1000000
  columns_subset: 0
  target: None
  predict: False
  forecast_all: False
  train_val_split: 0.8

# Model
model:
  name: 'lstm_vae'

resources:
  gpu_trial: 1
  cpu_trial: 12

opt:
  fine_tuning: False
  tune_report: 'mse_val_loss'
  k_fold_cv: 0
  metrics: ['train_loss', 'val_loss', 'mse_val_loss']
  order_by: 'mse_val_loss'
  num_workers: 0

